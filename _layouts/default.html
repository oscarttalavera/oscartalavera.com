<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% include meta.html %}
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/img/OT logo ngo.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#ffffff",
                    "background-light": "#ffffff",
                    "background-dark": "#000000",
                },
                fontFamily: {
                    "display": ["Inter", "sans-serif"]
                },
                borderRadius: {
                    "DEFAULT": "0px",
                    "lg": "0px",
                    "xl": "0px",
                    "full": "9999px"
                },
            },
        },
    }
  </script>

  <!-- Estilos del sitio: van después de Tailwind para que las utilidades sigan mandando -->
  <link rel="stylesheet" href="/assets/css/style.css" />
  {% if page.layout == 'post' %}
  <link rel="stylesheet" href="/assets/css/post.css" />
  {% elsif page.layout == 'recipe' %}
  <link rel="stylesheet" href="/assets/css/recipe.css" />
  {% elsif page.layout == 'car' %}
  <link rel="stylesheet" href="/assets/css/collection.css" />
  {% endif %}
</head>

<body class="bg-black text-zinc-100 font-display selection:bg-white selection:text-black">
  <a href="#main-content" class="skip-link">Saltar al contenido</a>
  {% include header.html %}

  <main id="main-content" class="relative">
    {{ content }}
  </main>

  {% include footer.html %}
</body>

</html>
