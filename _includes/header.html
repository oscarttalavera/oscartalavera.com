<nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-max max-w-[90vw]" id="main-nav">
  <div class="bg-black/80 backdrop-blur-md border border-white/20 px-8 py-3 rounded-full flex items-center justify-center gap-12">
    <div class="flex items-center gap-2">
      <a href="/#hero">
        <img alt="Oscar Talavera Logo" class="h-6 w-auto" src="/assets/img/OT logo bco.png"/>
      </a>
    </div>

    <!-- Desktop links -->
    <div class="hidden md:flex items-center gap-8">
      <a class="text-xs uppercase tracking-[0.2em] hover:text-primary/60 transition-colors" href="/#citations">Ideas</a>
      <a class="text-xs uppercase tracking-[0.2em] hover:text-primary/60 transition-colors" href="/textos">Textos</a>
      <a class="text-xs uppercase tracking-[0.2em] hover:text-primary/60 transition-colors" href="/coleccion">Colección</a>
      <a class="text-xs uppercase tracking-[0.2em] hover:text-primary/60 transition-colors" href="/recetas">Recetario</a>
    </div>

    <!-- Mobile hamburger button -->
    <button id="nav-toggle" class="md:hidden flex flex-col justify-center items-center gap-[5px] w-6 h-6" aria-label="Abrir menú">
      <span class="block w-5 h-[1.5px] bg-white transition-all duration-300" id="ham-1"></span>
      <span class="block w-5 h-[1.5px] bg-white transition-all duration-300" id="ham-2"></span>
      <span class="block w-5 h-[1.5px] bg-white transition-all duration-300" id="ham-3"></span>
    </button>
  </div>

  <!-- Mobile dropdown menu -->
  <div id="mobile-menu" class="md:hidden hidden mt-2 bg-black/80 backdrop-blur-md border border-white/20 rounded-2xl overflow-hidden">
    <div class="flex flex-col py-2">
      <a class="text-xs uppercase tracking-[0.2em] px-8 py-3 hover:bg-white/10 transition-colors" href="/#citations">Ideas</a>
      <a class="text-xs uppercase tracking-[0.2em] px-8 py-3 hover:bg-white/10 transition-colors" href="/textos">Textos</a>
      <a class="text-xs uppercase tracking-[0.2em] px-8 py-3 hover:bg-white/10 transition-colors" href="/coleccion">Colección</a>
      <a class="text-xs uppercase tracking-[0.2em] px-8 py-3 hover:bg-white/10 transition-colors" href="/recetas">Recetario</a>
    </div>
  </div>
</nav>

<script>
  (function() {
    var toggle = document.getElementById('nav-toggle');
    var menu   = document.getElementById('mobile-menu');
    var h1 = document.getElementById('ham-1');
    var h2 = document.getElementById('ham-2');
    var h3 = document.getElementById('ham-3');
    var open = false;

    function openMenu() {
      menu.classList.remove('hidden');
      h1.style.transform = 'translateY(6.5px) rotate(45deg)';
      h2.style.opacity   = '0';
      h3.style.transform = 'translateY(-6.5px) rotate(-45deg)';
      open = true;
    }

    function closeMenu() {
      menu.classList.add('hidden');
      h1.style.transform = '';
      h2.style.opacity   = '1';
      h3.style.transform = '';
      open = false;
    }

    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      open ? closeMenu() : openMenu();
    });

    // Close when clicking a link inside the mobile menu
    menu.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', closeMenu);
    });

    // Close when clicking outside
    document.addEventListener('click', function(e) {
      if (open && !document.getElementById('main-nav').contains(e.target)) {
        closeMenu();
      }
    });
  })();
</script>
